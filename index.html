"/programs":{t:"Programs | Windsor & Co.",d:"Practical technology programs for schools, universities and student communities. Six sessions, three online and three offline.",
h:()=>`${head("Programs","Learning That Goes Beyond the Classroom.","A practical workshop format for schools, universities and student communities, adapted to each institution.")}
<section><div class="w split"><div class="rv"><h2>6 practical sessions.</h2><p class="path" style="font-size:1rem"><span>3 online</span><span class="ar">+</span><span>3 offline</span></p></div><div class="rv"><div class="grid3" style="grid-template-columns:1fr 1fr;margin-top:0">${PROGRAMS.map((p,i)=>`<div><b style="color:var(--acc);font-size:.8rem">0${i+1}</b><h3>${p}</h3></div>`).join("")}</div><p class="mut" style="margin-top:1.5rem">Programs can be adapted for institutions. Topics, schedule and format are agreed together. Programs can be structured around an accessible student participation fee depending on the institution, format and program requirements.</p><div class="row">${btn("Bring Windsor & Co. to Your Institution","/contact")}</div></div></div></section>${cta()}`},
"/partnerships":{t:"Partnerships | Windsor & Co.",d:"Sponsorship and partnership opportunities across workshops, events and student communities.",
h:()=>`${head("Partnerships","Put Your Brand Where People Build the Future.","Collaborate through sponsorship, workshops, events, educational programs, student engagement and community initiatives. Recruitment exposure where appropriate.")}
<section><div class="w split"><div class="rv"><h2>Possible visibility</h2></div><div class="rv"><div class="grid3" style="grid-template-columns:1fr 1fr;margin-top:0">${["Banners","Posters","Reels","Social media","Event branding","On-ground activations","Partnership recognition"].map(x=>`<div><h3 style="font-size:1.05rem">${x}</h3></div>`).join("")}</div><p class="mut" style="margin-top:1.5rem">Partnership benefits are customized according to the event, audience and objectives. We don't promise specific reach, leads, hires or returns. Commercial arrangements are flexible and based on the scope and structure of each partnership.</p><div class="row">${btn("Become a Partner","/contact")}</div></div></div></section>${ecoSec()}${cta()}`},
"/projects":{t:"Projects | Windsor & Co.",d:"Windsor & Co. initiatives and collaborations will appear here as they develop.",
h:()=>`${head("Projects","Our story is just beginning.")}<section><div class="w">${PROJECTS.length?`<div class="svc">${PROJECTS.map(p=>`<article class="card c6"><span class="n">${p.category} · ${p.date}</span><h3>${p.title}</h3><p class="mut">${p.description}</p>${p.partner?`<p>Partner: ${p.partner}</p>`:""}${(p.images||[]).map(i=>`<img src="${i}" alt="${p.title}" loading="lazy" style="width:100%;margin-top:1rem">`).join("")}${p.cta?`<div class="row">${btn(p.cta.label,p.cta.href)}</div>`:""}</article>`).join("")}</div>`:`<div class="empty rv"><h2>Our story is just beginning.</h2><p class="lead" style="margin-inline:auto">New Windsor &amp; Co. initiatives and collaborations will appear here as they develop.</p><div class="row" style="justify-content:center">${btn("Start a Conversation","/contact")}</div></div>`}</div></section>${partners()}`},
"/contact":{t:"Contact | Windsor & Co.",d:"Start a conversation with Windsor & Co. about programs, events, sponsorship or partnerships.",
h:()=>`${head("Contact","Let's Start a Conversation.")}<section><div class="w split"><div class="rv"><p class="mut">Tell us a little about your organization and what you have in mind.</p><p style="margin-top:1.5rem">[Official Email]<br>[Phone Number]</p></div>
<div class="rv"><form id="cf" novalidate><div class="f2"><div><label for="fn1">Full Name *</label><input id="fn1" name="name" autocomplete="name" required><div class="err"></div></div><div><label for="fo">Organization</label><input id="fo" name="org" autocomplete="organization"><div class="err"></div></div></div>
<div class="f2"><div><label for="fd">Designation</label><input id="fd" name="role"><div class="err"></div></div><div><label for="fe">Email *</label><input id="fe" name="email" type="email" autocomplete="email" required><div class="err"></div></div></div>
<div class="f2"><div><label for="fp">Phone</label><input id="fp" name="phone" type="tel" autocomplete="tel"><div class="err"></div></div><div><label for="fi">Inquiry Type *</label><select id="fi" name="type" required><option value="">Select…</option>${INQ.map(i=>`<option>${i}</option>`).join("")}</select><div class="err"></div></div></div>
<div><label for="fm">Message *</label><textarea id="fm" name="msg" rows="5" required minlength="10"></textarea><div class="err"></div></div>
<div><button class="btn" type="submit" id="sb">Send Inquiry ${A}</button></div></form><div class="ok" id="okm" hidden role="status"><h3>Thank you.</h3><p class="mut">Your inquiry has been received. We'll be in touch.</p></div></div></div></section>`}
};

/* ===== ROUTER ===== */
const $=s=>document.querySelector(s),main=$("#main");
$("#nv").innerHTML=SITE.nav.map(n=>`<a href="#${n[1]}" data-r="${n[1]}">${n[0]}</a>`).join("")+`<a class="btn" href="#/contact">Work With Us ${A}</a>`;
$("#fn").innerHTML=SITE.nav.map(n=>`<li><a href="#${n[1]}">${n[0]}</a></li>`).join("");
const rm=matchMedia("(prefers-reduced-motion:reduce)");
function route(){
 const k=location.hash.slice(1)||"/",p=PAGES[k]||PAGES["/"],key=PAGES[k]?k:"/";
 document.title=p.t;document.querySelector('meta[name=description]').content=p.d;
 main.innerHTML=`<div class="pg">${p.h()}</div>`;scrollTo(0,0);
 document.querySelectorAll("#nv a[data-r]").forEach(a=>a.toggleAttribute("aria-current",a.dataset.r===key)||0);
 document.querySelectorAll("#nv a[data-r]").forEach(a=>a.dataset.r===key?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
 $("#nv").classList.remove("o");$("#bg").setAttribute("aria-expanded","false");
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("v");io.unobserve(e.target)}}),{threshold:.12});
 main.querySelectorAll(".rv").forEach(e=>io.observe(e));
 hero();flow();steps();form();
}
addEventListener("hashchange",route);
$("#bg").onclick=()=>{const o=$("#nv").classList.toggle("o");$("#bg").setAttribute("aria-expanded",o)};
addEventListener("scroll",()=>$("#hd").classList.toggle("s",scrollY>10),{passive:true});
document.querySelectorAll("[data-ph]").forEach(a=>a.onclick=e=>e.preventDefault());

/* ===== INTERACTIONS ===== */
function flow(){const f=$("#flow");if(!f)return;f.querySelectorAll("li").forEach(li=>li.querySelector("button").onclick=()=>{f.querySelectorAll("li").forEach(x=>{x.classList.remove("on");x.querySelector("button").setAttribute("aria-expanded","false")});li.classList.add("on");li.querySelector("button").setAttribute("aria-expanded","true")})}
function steps(){const s=$("#steps");if(!s)return;const u=()=>{const r=s.getBoundingClientRect(),p=Math.max(0,Math.min(1,(innerHeight*.6-r.top)/r.height));s.style.setProperty("--p",p*100+"%")};addEventListener("scroll",u,{passive:true});u()}
function form(){const f=$("#cf");if(!f)return;
 const chk=el=>{let m="";const v=el.value.trim();if(el.required&&!v)m="This field is required.";else if(el.type==="email"&&v&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))m="Enter a valid email address.";else if(el.name==="msg"&&v&&v.length<10)m="Please add a little more detail.";else if(el.type==="tel"&&v&&!/^[+\d][\d\s\-()]{6,}$/.test(v))m="Enter a valid phone number.";
  el.setAttribute("aria-invalid",!!m);const e=el.parentNode.querySelector(".err");e.textContent=m;e.id=el.id+"e";el.setAttribute("aria-describedby",e.id);return!m};
 f.querySelectorAll("input,select,textarea").forEach(el=>el.onblur=()=>chk(el));
 f.onsubmit=ev=>{ev.preventDefault();const bad=[...f.elements].filter(e=>e.name&&!chk(e));if(bad.length){bad[0].focus();return}
  const b=$("#sb");b.disabled=true;b.textContent="Sending…";
  /* TODO: connect to a real endpoint (e.g. Formspree/API). Currently simulated. */
  setTimeout(()=>{f.hidden=true;$("#okm").hidden=false;$("#okm").focus()},900)}}
function hero(){const c=$("#cv");if(!c)return;const x=c.getContext("2d");let W,H,N=[],raf;
 const rs=()=>{const d=devicePixelRatio||1;W=c.clientWidth;H=c.clientHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
  const n=Math.round(Math.min(46,W/24));N=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25}))};
 const col=()=>getComputedStyle(document.documentElement).getPropertyValue("--acc").trim()||"#9a7b4f";
 const dr=()=>{x.clearRect(0,0,W,H);const a=col();
  N.forEach((p,i)=>{if(!rm.matches){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}
   for(let j=i+1;j<N.length;j++){const q=N[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<140){x.globalAlpha=(1-d/140)*.35;x.strokeStyle=a;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}
   x.globalAlpha=.7;x.fillStyle=a;x.beginPath();x.arc(p.x,p.y,2,0,7);x.fill()});
  if(!rm.matches&&document.body.contains(c))raf=requestAnimationFrame(dr)};
 rs();dr();new ResizeObserver(()=>{rs();if(rm.matches)dr()}).observe(c)}
route();
</script>
</body>
</html>
